# /etc/nginx/snippets/ai-homework.conf on BANWAGONG, included from the api.bryht.net server block
# (next to /stick-notes/ and /brushup/). Public address: https://api.bryht.net/homework
# The trailing slashes strip the /homework prefix before the request reaches the app.

location = /homework { return 301 /homework/; }
location /homework/ {
    proxy_pass http://127.0.0.1:8787/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # AI replies stream as server-sent events: no buffering, long reads
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    # uploads up to 30 MB
    client_max_body_size 32m;
}
